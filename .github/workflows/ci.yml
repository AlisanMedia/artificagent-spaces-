name: Phase 1 foundation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Foundation acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out review branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.19.0"
          cache: npm
      - name: Reproducible install without lifecycle scripts
        run: npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund
      - name: Install locked project dependencies
        run: npm ci --ignore-scripts
      - name: Verify dependency compatibility
        run: npm ls --all
      - name: Lint, types, coverage, guardrails, production build
        run: npm run check
      - name: Dependency advisory check
        run: npm run security:audit
      - name: Record license inventory
        run: npm run licenses
      - name: Install test browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Browser, accessibility and local-only network checks
        run: npm run test:e2e
      - name: Retain review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase-1-acceptance-evidence
          path: |
            coverage/
            playwright-report/
            test-results/
            artifacts/
          retention-days: 7
