name: Spaces foundation and local platform

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: spaces-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Foundation acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CI_REVIEW_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out review branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan complete Git history with pinned Gitleaks
        run: bash scripts/scan-secrets.sh
      - name: Install CPU-only local media tools
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o APT::Update::Error-Mode=any update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --no-install-recommends --yes ffmpeg blender python3-numpy fonts-dejavu-core
          ffmpeg -version | head -1
          blender --version | head -1
          blender --background --factory-startup --disable-autoexec --python-exit-code 1 --python-expr "import bpy, numpy; assert bpy.ops.export_scene.gltf.get_rna_type().identifier"
      - name: Set up pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.19.0"
          cache: npm
      - name: Reproducible install without lifecycle scripts
        run: npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund
      - name: Install locked project dependencies
        run: npm ci --ignore-scripts
      - name: Verify dependency compatibility
        run: npm ls --all
      - name: Verify effective rules with read-only token; full merge gate stays separate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --use-env-proxy scripts/verify-repository.mjs --ci-visible
      - name: Lint, types, coverage, guardrails, production build
        run: |
          npm run lint
          npm run typecheck
          npm run test:coverage -- --reporter=default --reporter=json --outputFile=artifacts/governance/unit.json
          npm run test:governance
          npm run security:check
          npm run build
      - name: Bounded synthetic video quality lab and conditional economics
        run: |
          npm run lab:fixtures
          npm run lab:video
          npm run economics
      - name: Dependency advisory check
        run: npm audit --audit-level=high --json > artifacts/governance/audit.json
      - name: Record license inventory
        run: npm run sbom
      - name: Install test browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Browser, accessibility and local-only network checks
        run: npm run test:e2e
      - name: Verify synthetic Golden Property and isolated static product preview
        run: |
          npm run golden:verify
          npm run preview:build
          npm run preview:test
      - name: Validate and prepare public aggregate evidence
        run: npm run ci:summary
      - name: Retain reviewed aggregate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase-1-acceptance-evidence
          path: artifacts/governance/public-ci-summary.json
          if-no-files-found: error
          retention-days: 7
